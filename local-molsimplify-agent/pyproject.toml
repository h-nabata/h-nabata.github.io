[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-molsimplify-agent"
version = "0.1.0"
description = "Offline-first semi-autonomous molecular structure generation agent using molSimplify"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "local-molsimplify-agent contributors"}]
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "numpy>=1.24",
  "ase>=3.22",
  "typer>=0.12",
  "requests>=2.31"
]

[project.optional-dependencies]
agent = ["requests>=2.31"]
chem = ["rdkit", "openbabel"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]
all = ["local-molsimplify-agent[agent,chem,dev]"]

[project.scripts]
lma = "local_molsimplify_agent.cli:app"

[tool.pytest.ini_options]
markers = [
  "external_tools: tests requiring external executables",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
