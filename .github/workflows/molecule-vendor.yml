name: Prepare molecule editor engines
on:
  push:
    branches: [main]
    paths: ['.github/workflows/molecule-vendor.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned Ketcher standalone
        run: |
          curl -fL --retry 3 https://github.com/epam/ketcher/releases/download/v3.18.0/ketcher-standalone-3.18.0.zip -o /tmp/ketcher.zip
          echo '484e7f10a0e74808ae5f43f0e6448db6f4d884bdd2189aa271108474167a3e7e  /tmp/ketcher.zip' | sha256sum -c
          unzip -q /tmp/ketcher.zip -d /tmp/ketcher
          root=$(find /tmp/ketcher -name index.html | head -1 | xargs dirname)
          test -n "$root"
          mkdir -p molecule-visualizer/vendor/ketcher
          cp -a "$root"/. molecule-visualizer/vendor/ketcher/
          curl -fL https://raw.githubusercontent.com/epam/ketcher/v3.18.0/LICENSE -o molecule-visualizer/vendor/ketcher/LICENSE
      - name: Download pinned Open Babel WebAssembly
        run: |
          mkdir -p molecule-visualizer/vendor/openbabel
          for asset in openbabel.js openbabel.wasm openbabel.data openbabel.data.js; do
            curl -fL --retry 3 "https://raw.githubusercontent.com/partridgejiang/cheminfo-to-web/4ccb195c2916e99905abf264bf6212f2b4f9a10d/OpenBabel3/OpenBabel-js/bin/$asset" -o "molecule-visualizer/vendor/openbabel/$asset"
          done
          curl -fL https://raw.githubusercontent.com/openbabel/openbabel/master/COPYING -o molecule-visualizer/vendor/openbabel/COPYING
          echo 'Open Babel WebAssembly source and build instructions: https://github.com/partridgejiang/cheminfo-to-web/tree/4ccb195c2916e99905abf264bf6212f2b4f9a10d/OpenBabel3' > molecule-visualizer/vendor/openbabel/SOURCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: molecule-engines
          path: molecule-visualizer/vendor
          retention-days: 7
