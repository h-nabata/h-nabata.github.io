name: Add missing Qiita mirrors
on:
  push:
    branches: [qiita-missing-20261107]
    paths: [.github/workflows/qiita-once.yml]
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qiita-missing-20261107
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lxml
      - run: python scripts/sync_qiita_new_once.py
      - name: Commit snapshot to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/qiita_articles.json qiita/backup qiita/index.html qiita/*.html assets/qiita/images
          git commit -m "Add missing Qiita article mirrors"
          git push origin HEAD:qiita-missing-20261107
