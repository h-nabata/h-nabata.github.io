name: Molecule editor tests
on:
  push:
    branches: [main, molecule-studio-v3, molecule-research-workflows, molecule-performance-*, molecule-llmlip-*, molecule-dsafir-*, molecule-md-*]
    paths: ['molecule-visualizer/**', '.github/workflows/molecule-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gxtb-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONPATH: molecule-visualizer/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r molecule-visualizer/local-engine/requirements.txt 'rdkit>=2024.3' 'tblite>=0.4,<1'
      - name: Download and verify the official g-xTB Linux release
        working-directory: ${{ runner.temp }}
        run: |
          archive=xtb-6.7.1-gxtb-140526-linux-x86_64.tar.xz
          curl --fail --location --silent --show-error --retry 3 --output "$archive" "https://github.com/grimme-lab/g-xtb/releases/download/v2.0.1/$archive"
          echo "cdfb81164f8d3300fc451dbbf2414528b533e71f7a30ec824b564cd30d6d9e5c  $archive" | sha256sum -c -
          tar -xJf "$archive" xtb-6.7.1/bin/xtb
          echo "GXTB_TEST_BINARY=$RUNNER_TEMP/xtb-6.7.1/bin/xtb" >> "$GITHUB_ENV"
      - name: Check native gradients, AFIR, and mapped butadiene paths
        run: >
          python -m unittest -v
          test_engine.NativeGXTB test_afir_engine.NativeAFIR
          test_butadiene_path.ButadienePaths.test_gxtb_mapped_paths
          test_butadiene_path.ButadienePaths.test_gxtb_unrestricted_perturbed_neb
          test_butadiene_path.ButadienePaths.test_gxtb_explicitly_projects_asymmetric_string
          test_path_optimizer_controls.UnrestrictedPathControls.test_gxtb_mobile_end_ethane_torsion
      - name: Check native MD energy conservation and classical force fields
        run: python -m unittest -v test_md_native test_rdkit_md
      - name: Compare fresh and restarted electronic states at two nearby geometries
        run: python molecule-visualizer/scripts/probe_butadiene_gxtb.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Run unrestricted native g-xTB path optimizations through the browser
        run: node molecule-visualizer/tests/gxtb-path-browser.cjs
      - name: Run native MD and play sampled trajectories in Chromium
        run: node molecule-visualizer/tests/md-browser.cjs
  llmlip-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LLMLIP_TEST_MODEL: ${{ github.workspace }}/.llmlip-upstream/examples/model.e3rs
      LLMLIP_STRESS_TEST_MODEL: ${{ github.workspace }}/molecule-visualizer/tests/fixtures/npt-scalar.e3rs
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mizukami-group/llmlip.rs
          ref: 6bfb0418cc5aba0a13416fd783994fa82552cc34
          path: .llmlip-upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache/restore@v4
        id: llmlip-wheel
        with:
          path: .llmlip-wheels
          key: llmlip-cpu-ubuntu24.04-${{ runner.arch }}-py312-parallel-6bfb0418cc5aba0a13416fd783994fa82552cc34-v1
      - name: Install CPU adapter dependencies
        run: python -m pip install -r molecule-visualizer/local-engine/requirements.txt 'sella>=2.6,<3' 'maturin>=1.9,<2'
      - name: Build pinned CPU binding without PyTorch
        if: steps.llmlip-wheel.outputs.cache-hit != 'true'
        run: python -m maturin build --release --locked --manifest-path .llmlip-upstream/crates/llmlip-py/Cargo.toml --features parallel --out .llmlip-wheels
      - name: Install native CPU wheel
        run: |
          python -m pip install .llmlip-wheels/*.whl
          python -c "import importlib.util; assert importlib.util.find_spec('torch') is None"
      - name: Native public synthetic model and adapter contracts
        run: python -m unittest discover -s molecule-visualizer/tests -p test_llmlip.py -v
      - uses: actions/cache/save@v4
        if: steps.llmlip-wheel.outputs.cache-hit != 'true'
        with:
          path: .llmlip-wheels
          key: ${{ steps.llmlip-wheel.outputs.cache-primary-key }}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Native CPU browser integration
        run: node molecule-visualizer/tests/llmlip-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llmlip-browser-results
          path: test-artifacts
          retention-days: 7
  anysolv-native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install 'anysolv[ase]==0.1.0' 'psutil>=5.9,<8'
      - name: Public compact model finite difference and vacuum baseline
        env:
          PYTHONPATH: molecule-visualizer/tests
          ANYSOLV_TEST_MODEL: model_compact
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: python -m unittest test_anysolv.NativeAnySolv -v
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local energy bridge dependencies
        run: python -m pip install -r molecule-visualizer/local-engine/requirements.txt 'tblite>=0.4,<1' 'sella>=2.6,<3'
      - name: Numerical and local service tests
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: python -m unittest discover -s molecule-visualizer/tests -p 'test_*.py' -v
      - run: node --test molecule-visualizer/tests/*.test.cjs
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Browser integration
        run: |
          mkdir -p test-artifacts
          python molecule-visualizer/scripts/preview.py > /tmp/preview.log 2>&1 &
          molecule_test_status=0
          node molecule-visualizer/tests/import-browser.cjs || molecule_test_status=1
          node molecule-visualizer/tests/performance-browser.cjs || molecule_test_status=1
          node molecule-visualizer/tests/browser.cjs || molecule_test_status=1
          node molecule-visualizer/tests/dsafir-browser.cjs || molecule_test_status=1
          node molecule-visualizer/tests/engine-browser.cjs || molecule_test_status=1
          node molecule-visualizer/tests/batch-browser.cjs || molecule_test_status=1
          node molecule-visualizer/tests/constraints-browser.cjs || molecule_test_status=1
          node molecule-visualizer/tests/group-constraints-browser.cjs || molecule_test_status=1
          node molecule-visualizer/tests/clipboard-browser.cjs || molecule_test_status=1
          node molecule-visualizer/tests/uma-browser.cjs || molecule_test_status=1
          node molecule-visualizer/tests/anysolv-browser.cjs || molecule_test_status=1
          node molecule-visualizer/tests/ts-browser.cjs || molecule_test_status=1
          node molecule-visualizer/tests/measurements-browser.cjs || molecule_test_status=1
          node molecule-visualizer/tests/workflow-browser.cjs || molecule_test_status=1
          node molecule-visualizer/tests/analysis-browser.cjs || molecule_test_status=1
          node molecule-visualizer/tests/optimization-browser.cjs || molecule_test_status=1
          node molecule-visualizer/tests/model-f-browser.cjs || molecule_test_status=1
          git fetch --depth=1 origin 0b1ce3a38659c588d1f60c224c87ef73da1e5eca
          node molecule-visualizer/tests/benchmark_resource_browser.cjs || molecule_test_status=1
          git fetch --depth=1 origin f70b9b8ca1f1ba7f88eac09a7fcd3a5ed862a87c
          node molecule-visualizer/tests/benchmark_ui_efficiency.cjs || molecule_test_status=1
          exit "$molecule_test_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: molecule-browser-results
          path: test-artifacts
          retention-days: 7
