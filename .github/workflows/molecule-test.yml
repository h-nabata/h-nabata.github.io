name: Molecule editor tests
on:
  push:
    branches: [main, molecule-studio-v3, molecule-research-workflows, molecule-performance-*]
    paths: ['molecule-visualizer/**', '.github/workflows/molecule-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  anysolv-native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install 'anysolv[ase]==0.1.0' 'psutil>=5.9,<8'
      - name: Public compact model finite difference and vacuum baseline
        env:
          PYTHONPATH: molecule-visualizer/tests
          ANYSOLV_TEST_MODEL: model_compact
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: python -m unittest test_anysolv.NativeAnySolv -v
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local energy bridge dependencies
        run: python -m pip install -r molecule-visualizer/local-engine/requirements.txt 'tblite>=0.4,<1' 'sella>=2.6,<3'
      - name: Numerical and local service tests
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: python -m unittest discover -s molecule-visualizer/tests -p 'test_*.py' -v
      - run: node --test molecule-visualizer/tests/*.test.cjs
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Browser integration
        run: |
          mkdir -p test-artifacts
          python molecule-visualizer/scripts/preview.py > /tmp/preview.log 2>&1 &
          molecule_test_status=0
          node molecule-visualizer/tests/import-browser.cjs || molecule_test_status=1
          node molecule-visualizer/tests/performance-browser.cjs || molecule_test_status=1
          node molecule-visualizer/tests/browser.cjs || molecule_test_status=1
          node molecule-visualizer/tests/engine-browser.cjs || molecule_test_status=1
          node molecule-visualizer/tests/batch-browser.cjs || molecule_test_status=1
          node molecule-visualizer/tests/constraints-browser.cjs || molecule_test_status=1
          node molecule-visualizer/tests/group-constraints-browser.cjs || molecule_test_status=1
          node molecule-visualizer/tests/clipboard-browser.cjs || molecule_test_status=1
          node molecule-visualizer/tests/uma-browser.cjs || molecule_test_status=1
          node molecule-visualizer/tests/anysolv-browser.cjs || molecule_test_status=1
          node molecule-visualizer/tests/ts-browser.cjs || molecule_test_status=1
          node molecule-visualizer/tests/measurements-browser.cjs || molecule_test_status=1
          node molecule-visualizer/tests/workflow-browser.cjs || molecule_test_status=1
          node molecule-visualizer/tests/analysis-browser.cjs || molecule_test_status=1
          node molecule-visualizer/tests/optimization-browser.cjs || molecule_test_status=1
          node molecule-visualizer/tests/model-f-browser.cjs || molecule_test_status=1
          git fetch --depth=1 origin 0b1ce3a38659c588d1f60c224c87ef73da1e5eca
          node molecule-visualizer/tests/benchmark_resource_browser.cjs || molecule_test_status=1
          exit "$molecule_test_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: molecule-browser-results
          path: test-artifacts
          retention-days: 7
